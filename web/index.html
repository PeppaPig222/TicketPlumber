<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小哈工单智能诊断助手</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
    .page { max-width: 1080px; margin: 0 auto; padding: 32px 20px 48px; }
    .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); margin-bottom: 20px; }
    h1, h2 { margin: 0 0 12px; }
    textarea { width: 100%; min-height: 120px; padding: 14px; border-radius: 12px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 14px; }
    button { border: none; border-radius: 12px; background: #2563eb; color: #fff; padding: 12px 20px; font-size: 14px; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: wait; }
    .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
    .muted { color: #64748b; font-size: 14px; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #dbeafe; color: #1d4ed8; font-size: 12px; margin-right: 8px; }
    .trace-round { border-left: 3px solid #2563eb; padding-left: 12px; margin-bottom: 18px; }
    .trace-agent { padding: 8px 10px; margin: 8px 0; background: #f8fafc; border-radius: 10px; }
    ul { margin: 8px 0 0; padding-left: 20px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>小哈工单智能诊断助手</h1>
      <p class="muted">支持工单诊断、多轮 Loop、三路并行排查和 trace 回放。</p>
      <textarea id="query">请诊断工单 WO-20260815-0421</textarea>
      <div style="margin-top: 12px;">
        <button id="runButton">开始诊断</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>诊断结论</h2>
        <div id="diagnosis" class="muted">等待执行...</div>
      </div>
      <div class="card">
        <h2>Trace 面板</h2>
        <div id="trace" class="muted">暂无 trace</div>
      </div>
    </div>
  </div>

  <script>
    const runButton = document.getElementById("runButton");
    const diagnosisEl = document.getElementById("diagnosis");
    const traceEl = document.getElementById("trace");
    const queryEl = document.getElementById("query");

    function renderDiagnosis(data) {
      const diagnosis = data.diagnosis || {};
      diagnosisEl.innerHTML = `
        <div class="pill">${data.scenario || "unknown"}</div>
        <div class="pill">${diagnosis.responsible_party || "待判定"}</div>
        <p><strong>摘要：</strong>${diagnosis.summary || "-"}</p>
        <p><strong>根因：</strong>${diagnosis.root_cause || "-"}</p>
        <p><strong>建议：</strong></p>
        <ul>${(diagnosis.recommendations || []).map(item => `<li>${item}</li>`).join("")}</ul>
      `;
    }

    function renderTrace(trace) {
      const rounds = trace.rounds || [];
      traceEl.innerHTML = rounds.map(round => `
        <div class="trace-round">
          <div><strong>Round ${round.round_num}</strong> · ${round.intent} · ${round.duration_ms}ms</div>
          ${(round.agents || []).map(agent => `
            <div class="trace-agent">
              <div><strong>${agent.agent_name}</strong> · ${agent.status} · ${agent.duration_ms}ms</div>
              <div class="muted">${agent.output_summary || "-"}</div>
            </div>
          `).join("")}
          <div class="muted">决策：${round.decision}</div>
        </div>
      `).join("");
    }

    runButton.addEventListener("click", async () => {
      runButton.disabled = true;
      diagnosisEl.textContent = "诊断中...";
      traceEl.textContent = "trace 生成中...";

      try {
        const response = await fetch("/api/v1/diagnose", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: queryEl.value })
        });
        const data = await response.json();
        renderDiagnosis(data);
        renderTrace(data.trace || {});
      } catch (error) {
        diagnosisEl.textContent = `调用失败：${error.message}`;
        traceEl.textContent = "trace 获取失败";
      } finally {
        runButton.disabled = false;
      }
    });
  </script>
</body>
</html>
